<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Event Venue Seating Allocator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="p-6 text-stone-800">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="glass-card rounded-2xl p-6 flex justify-between items-center shadow-lg">
            <div>
                <h1 class="text-3xl font-serif font-bold tracking-wide">Admin Portal</h1>
                <p class="text-xs text-stone-500 mt-1"><i class="fa-solid fa-database text-amber-600 mr-1"></i> Managed via C Backend & SQLite Engine</p>
            </div>
            <a href="index.html" class="px-4 py-2 bg-stone-800 text-stone-100 hover:bg-stone-700 transition rounded-xl text-xs font-semibold shadow">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Visualizer
            </a>
        </header>

        <!-- Admin Overview Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-card rounded-2xl p-5 shadow-lg border-l-4 border-amber-700">
                <p class="text-xs uppercase tracking-wider text-stone-500 font-semibold">Total Registered Users</p>
                <h3 id="stat-users-count" class="text-3xl font-serif font-bold text-stone-800 mt-2">1</h3>
            </div>
            <div class="glass-card rounded-2xl p-5 shadow-lg border-l-4 border-stone-800">
                <p class="text-xs uppercase tracking-wider text-stone-500 font-semibold">Active Saved Events</p>
                <h3 id="stat-events-count" class="text-3xl font-serif font-bold text-stone-800 mt-2">1</h3>
            </div>
            <div class="glass-card rounded-2xl p-5 shadow-lg border-l-4 border-emerald-700">
                <p class="text-xs uppercase tracking-wider text-stone-500 font-semibold">Database Engine</p>
                <h3 class="text-2xl font-serif font-bold text-stone-800 mt-2">SQLite 3 (Embedded)</h3>
            </div>
        </div>

        <!-- Registered Clients Directory Table -->
        <main class="glass-card rounded-2xl p-6 shadow-lg space-y-4">
            <div class="flex justify-between items-center border-b pb-4">
                <h2 class="text-xl font-serif font-bold text-stone-800">Client Directory</h2>
                <button id="refresh-clients-btn" class="px-3 py-1.5 bg-stone-200 text-stone-800 rounded-lg text-xs font-medium hover:bg-stone-300 transition">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i> Refresh Data
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-stone-200 text-xs font-semibold text-stone-500 uppercase tracking-wider">
                            <th class="py-3 px-4">User ID</th>
                            <th class="py-3 px-4">Username</th>
                            <th class="py-3 px-4">Email</th>
                            <th class="py-3 px-4">Role</th>
                            <th class="py-3 px-4">Saved Events</th>
                        </tr>
                    </thead>
                    <tbody id="client-table-body" class="divide-y divide-stone-200 text-sm text-stone-700">
                        <tr>
                            <td class="py-3 px-4 font-mono text-xs">#1</td>
                            <td class="py-3 px-4 font-semibold">Admin</td>
                            <td class="py-3 px-4">admin@gala.com</td>
                            <td class="py-3 px-4"><span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold">Administrator</span></td>
                            <td class="py-3 px-4">1</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/admin/users')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('client-table-body');
                    if (Array.isArray(data) && data.length > 0) {
                        tbody.innerHTML = data.map(user => `
                            <tr>
                                <td class="py-3 px-4 font-mono text-xs">#${user.id}</td>
                                <td class="py-3 px-4 font-semibold">${user.username}</td>
                                <td class="py-3 px-4">${user.email}</td>
                                <td class="py-3 px-4">
                                    <span class="px-2 py-0.5 ${user.is_admin ? 'bg-amber-100 text-amber-800' : 'bg-stone-100 text-stone-700'} rounded-full text-xs font-semibold">
                                        ${user.is_admin ? 'Administrator' : 'Client'}
                                    </span>
                                </td>
                                <td class="py-3 px-4">${user.total_events || 0}</td>
                            </tr>
                        `).join('');
                        document.getElementById('stat-users-count').textContent = data.length;
                    }
                })
                .catch(err => console.error('Error fetching admin data:', err));
        });
    </script>
</body>
</html>
